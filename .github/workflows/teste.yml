name: Teste

on:
  schedule:
    - cron: '0 4 * * 1-5' # it will run at 05:00 hours, all weekdays
    - cron: '0 7 * * 1-5' # it will run at 08:00 hours, all weekdays

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Hour to schedule
        id: inventory
        shell: bash
        run: |
          echo "Hora UTC: $(date -u '+%H:%M:%S')"
          if [ "$(date -u '+%H:%M')" == "04:00" ]; then
            branch="qual"
          elif [ "$(date -u '+%H:%M')" == "07:00" ]; then
            branch="dev"
          fi

          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Checkout branch to consider
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.inventory.outputs.branch }}
          show-progress: true

      - name: Show README content
        run: |
          cat README.md
