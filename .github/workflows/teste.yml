name: Teste

on:
  workflow_dispatch:
    inputs:
      time:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
  #schedule:
  #  - cron: '*/5 * * * *'  # a cada 5 minutos em UTC

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Determine current time
        shell: bash
        run: |
          current_time="$(TZ=Europe/Lisbon date '+%H:%M')"
          current_day="$(TZ=Europe/Lisbon date '+%u')"

          echo "Current time is $current_time and current day is $current_day"

          #if [ "${current_day}" = "1" ] && [ "${current_time}" = "15:25" ]; then
          #  echo "Current time is $current_time"
          #fi