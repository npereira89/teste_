name: Teste

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'main'

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Determine current time
        shell: bash
        run: |
          current_time="$(TZ=Europe/Lisbon date '+%H:%M')"
          if [ $current_time = "15:05" ]; then
            echo "Current time is $current_time"
          fi