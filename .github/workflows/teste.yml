name: Teste

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Determine branch from schedule
        id: inventory
        shell: bash
        run: |
          current_time="$(TZ=Europe/Lisbon date '+%H:%M')"
          echo "Hora UTC: $(date -u '+%H:%M:%S')"
          echo "Hora local: $current_time"