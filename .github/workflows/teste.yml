name: Teste

on:
  schedule:
    - cron: '0 0-23 * * 0-6' # it will run at 9:00 AM UTC every weekday (Monday through Friday)

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Determine branch from schedule
        id: inventory
        shell: bash
        run: |
          current_time="$(TZ=Europe/Lisbon date '+%H:%M')"
          if [ "${current_time}" = "08:00" ]; then
            branch="dev"
          elif [ "${current_time}" = "05:00" ]; then
            branch="qual"
          elif [ "${current_time}" = "23:45" ]; then
            echo "This is Sunday!! Nothing to say!"
          fi

          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Checkout branch to consider
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.inventory.outputs.branch }}
          show-progress: true

      - name: Show README content
        run: |
          cat README.md
