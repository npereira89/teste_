name: Teste

on:
  schedule:
    - cron: '*/1 * * * *' # it will run each a 1 minute, all weekdays

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Determine current time
        shell: bash
        run: |
          current_time="$(TZ=Europe/Lisbon date '+%H:%M')"
          if [ "${current_time}" = "15:20" ]; then
            echo "Current time is $current_time"
          fi