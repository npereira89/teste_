name: Teste

on:
  schedule:
    - cron: '0 20 * * *'

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Determine branch from schedule
        id: inventory
        shell: bash
        run: |
          if [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            branch="dev"
          else
            branch="qual"
          fi

          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Checkout branch to consider
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.inventory.outputs.branch }}
          show-progress: true

      - name: Show README content
        run: |
          cat README.md