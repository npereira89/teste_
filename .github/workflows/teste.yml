name: Teste

run-name: >-
  ${{
    github.event_name == 'schedule' &&
    (
      github.event.schedule == '05 03 * * *' && 'Deploy netwin-ptc-dev (Schedule)' ||
      github.event.schedule == '25 17 * * *' && 'Deploy netwin-ptc-tst (Schedule)'
    ) ||
    format('Deploy {0}', inputs.inventory)
  }}

  if github.event.schedule == '05 03 * * *' then
    branch="qual"
  elif github.event.schedule == '25 17 * * *' then
    branch="dev"
  fi

  echo "branch=${branch}" >> "$GITHUB_OUTPUT"

on:
  schedule:
    - cron: "05 03 * * *" # netwin-ptc-dev
    - cron: "25 17 * * *" # netwin-ptc-tst

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Hour to schedule
        id: inventory
        shell: bash
        run: |
          echo "Hora UTC: $(date -u '+%H:%M:%S')"

      - name: Checkout branch to consider
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.inventory.outputs.branch }}
          show-progress: true

      - name: Show README content
        run: |
          cat README.md
