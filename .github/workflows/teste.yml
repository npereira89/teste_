name: Teste

run-name: >-
  ${{
    github.event_name == 'schedule' &&
    (
      github.event.schedule == '10 20 * * *' 
    ) ||
    format('Deploy {0}', inputs.inventory)
  }}

on:
  schedule:
    - cron: "10 20 * * *" # netwin-ptc-tst
  workflow_dispatch:
    inputs:
      inventory:
        description: 'Inventory to deploy'
        required: true
        default: 'master'
        run: |
          echo "Inventory: ${{ github.event.inputs.inventory }}" 
          branch="${{ github.event.inputs.inventory }}" >> $GITHUB_OUTPUT  

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Hour to schedule
        id: inventory
        shell: bash
        run: |
          echo "Hora UTC: $(date -u '+%H:%M')"

      - name: Checkout branch to consider
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.inventory.outputs.branch }}
          show-progress: true

      - name: Show README content
        run: |
          cat README.md
