name: Teste

run-name: >-
  ${{
    github.event_name == 'schedule' &&
    (
      github.event.schedule == '0 2 * * *' && 'Deploy Developer (Schedule)' ||
      github.event.schedule == '0 5 * * *' && 'Deploy Qualidade (Schedule)' 
    ) ||
    format('Deploy {0}', inputs.inventory)
  }}


on:
  schedule:
    - cron: "0 2 * * *" # dev
    - cron: "0 5 * * *" # qual

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Get branch to consider
        id: getBranch
        shell: bash
        run: |

          if [ "${{ github.event.schedule }}" = "0 2 * * *"  ]; then
            branch="dev"
          elif [ "${{ github.event.schedule }}" = "0 5 * * *"  ]; then
            branch="qual"
          else
            echo "No schedule match for this workflow run."
          fi

          echo "Selected branch: ${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"


      - name: Checkout branch to consider
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.getBranch.outputs.branch }}
          show-progress: true

      - name: Show README content
        run: |
          cat README.md
