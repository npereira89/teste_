name: Teste

run-name: >-
  ${{
    github.event_name == 'schedule' &&
    (
      github.event.schedule == '35 21 * * *'
    ) ||
    format('Deploy {0}', inputs.inventory)
  }}

on:
  schedule:
    - cron: "35 21 * * *" # qual

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Get branch to consider
        id: getBranch
        shell: bash
        run: |
          if [ "${{ github.event.schedule }}" = "35 21 * * *" ]; then
            branch="qual" >> $GITHUB_OUTPUT
          else
            branch="dev" >> $GITHUB_OUTPUT
          fi

      - name: Checkout branch to consider
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.getBranch.outputs.branch }}
          show-progress: true

      - name: Show README content
        run: |
          cat README.md
