name: Teste

on:
  schedule:
    - cron: '0 8 * * 1-5' # it will run at 9:00 AM UTC every weekday (Monday through Friday) 
    - cron: "0 5 * * 1-5"  # it will run at 6:00 AM UTC every weekday (Monday through Friday)
    - cron: "50 20 * * 0"  # it will run at 21:50 PM UTC in Sunday 

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Determine branch from schedule
        id: inventory
        shell: bash
        run: |
          if [ "${{ github.event.schedule }}" = "0 9 * * 1-5" ]; then
            branch="dev"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 1-5" ]; then
            branch="qual"
          elif [ "${{ github.event.schedule }}" = "50 20 * * 0"]; then
            echo "This is Sunday!! Nothing to say!"
          fi

          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Checkout branch to consider
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.inventory.outputs.branch }}
          show-progress: true

      - name: Show README content
        run: |
          cat README.md
