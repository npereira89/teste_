name: Teste

on:
  schedule:
    - cron: '0 9 * * 1-5' #  
    - cron: "0 6 * * 1-5"  

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Determine branch from schedule
        id: inventory
        shell: bash
        run: |
          if [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            branch="dev"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 1-5" ]; then
            branch="qual"
          fi

          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Checkout branch to consider
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.inventory.outputs.branch }}
          show-progress: true

      - name: Show README content
        run: |
          cat README.md
