name: Teste

run-name: >-
  ${{
    github.event_name == 'schedule' &&
    (
      github.event.schedule == '15 21 * * *' && inputs.inventory = 'dev'
    ) ||
    format('Deploy {0}', inputs.inventory)
  }}

on:
  schedule:
    - cron: "15 21 * * *" # dev
  workflow_dispatch:
    inputs:
      inventory:
        description: 'Branch to consider'
        required: true

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Get branch to consider
        id: getBranch
        shell: bash
        run: |
          echo "Branch to consider: ${{ inputs.inventory }}"
          echo branch="${{ inputs.inventory }}" >> $GITHUB_OUTPUT

      - name: Checkout branch to consider
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.getBranch.outputs.branch }}
          show-progress: true

      - name: Show README content
        run: |
          cat README.md
