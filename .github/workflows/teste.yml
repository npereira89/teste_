name: Teste

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Determine current time
        shell: bash
        run: |
          current_time="$(TZ=Europe/Lisbon date '+%H:%M')"

          if [ "${current_time}" = "16:10" ]; then
            echo "É 16:10!"
          else
            echo "Não é 16:10. Parando."
            exit 0
          fi