name: Teste

run-name: >-
  ${{
    github.event_name == 'schedule' &&
    (
      github.event.schedule == '15 21 * * *' && inputs.inventory == 'dev' &&
      github.event.schedule == '25 21 * * *' && inputs.inventory == 'qual'
    ) ||
    format('Deploy {0}', inputs.inventory)
  }}

on:
  schedule:
    - cron: "15 21 * * *" # dev
    - cron: "25 21 * * *" # qual
  workflow_dispatch:
    inputs:
      inventory:
        description: 'Branch to consider'
        required: true

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Get branch to consider
        id: getBranch
        shell: bash
        run: |
          if [ "${{ github.event.schedule }}" = "15 21 * * *" ]; then
            branch="dev"
          elif [ "${{ github.event.schedule }}" = "25 21 * * *" ]; then
            branch="qual"
          else
            branch="${{ inputs.inventory }}"
          fi

          branch="${{ inputs.inventory }}" >> $GITHUB_OUTPUT

      - name: Checkout branch to consider
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.getBranch.outputs.branch }}
          show-progress: true

      - name: Show README content
        run: |
          cat README.md
