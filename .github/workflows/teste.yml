name: Teste

on:
  workflow_dispatch:
    inputs:
      inventory:
        description: Branch to deploy
        required: true
        type: string

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch to consider
        uses: actions/checkout@v4
        with:
          repository: ${{github.repository}}
          ref: ${{ github.event.inputs.inventory }}
          show-progress: true

      - name: Show README content
        run: |
          cat README.md