name: Teste

run-name: >-
  ${{
    github.event_name == 'schedule' &&
    (
      github.event.schedule == '20 22 * * *' && 'Deploy Developer (Schedule)' ||
      github.event.schedule == '30 22 * * *' && 'Deploy Qualidade (Schedule)' 
    ) ||
    format('Deploy {0}', inputs.inventory)
  }}


on:
  schedule:
    - cron: "20 22 * * *" # dev
    - cron: "30 22 * * *" # qual

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Get branch to consider
        id: getBranch
        shell: bash
        run: |
          if [ "${{ github.event.schedule }}" = "20 22 * * *" ]; then
            branch="dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 22 * * *" ]; then
            branch="qual" >> $GITHUB_OUTPUT
          fi

          echo "Nothing to do for schedule!!"

      - name: Checkout branch to consider
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.getBranch.outputs.branch }}
          show-progress: true

      - name: Show README content
        run: |
          cat README.md
