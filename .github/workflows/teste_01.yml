name: Teste de agendamento

on:
  schedule:
    - cron: '30 15 * * *'

jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Determine hour executed from schedule
        id: inventory
        shell: bash
        run: |
          echo "Este workflow foi disparado pelo agendamento do GitHub Actions às ${{ github.event.schedule }}."