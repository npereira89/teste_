name: Teste de agendamento

on:
  schedule:
    - cron: '10 21 * * *'

jobs:
  validate-context:
    name: Give information about the workflow schedule
    runs-on: ubuntu-latest
    steps:
      - name: Determine hour executed from schedule
        shell: bash
        run: |
          echo "Este workflow foi disparado pelo agendamento do GitHub Actions às $(date +'%H:%M')"
