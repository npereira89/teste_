name: Teste de agendamento

on:
  schedule:
    - cron: '*/5 * * * *'
      cron: '20 20 * * *'
      branches:
        include:
        - main

jobs:
  validate-context:
    name: Give information about the workflow schedule
    runs-on: ubuntu-latest
    steps:
      - name: Determine hour executed from schedule
        id: inventory
        shell: bash
        run: |
          echo "Este workflow foi disparado pelo agendamento do GitHub Actions às $(date +'%H:%M:%S')"
