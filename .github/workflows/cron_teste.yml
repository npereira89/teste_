name: Agenda

on:
  schedule:
    - cron: "50 22 * * 0"  
      timezone: "Europe/Lisbon" # it will run at 22:30 PM Lisbon time in Sunday
    
jobs:
  validate-context:
    name: Validate workflow context
    runs-on: ubuntu-latest
    steps:
      - name: Determine branch from schedule
        id: inventory
        shell: bash
        run: |
          if [ "${{ github.event.schedule }}" = "50 22 * * 0"  ]; then
            echo "OK!!"
          fi
          echo "NOK!!"
          
          